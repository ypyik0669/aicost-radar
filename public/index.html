<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 用量监控</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📟</text></svg>">
<style>
  /* ---------- 令牌:单套深色发光系 ---------- */
  :root {
    color-scheme: dark;
    --page: #0a0d12;
    --card-g: linear-gradient(180deg, #151a23, #10141b);
    --line: rgba(255,255,255,.07);
    --line-strong: rgba(255,255,255,.14);
    --tp: #f4f6fb;
    --ts: #9aa4b5;
    --tm: #5f6b7d;
    --chip: rgba(255,255,255,.04);
    --chip-hover: rgba(255,255,255,.08);
    --row-hover: rgba(34,211,238,.05);
    --track: rgba(255,255,255,.07);
    --cyan: #22d3ee;
    --violet: #8b5cf6;
    --accent: #22d3ee;
    --grad: linear-gradient(90deg, #22d3ee, #8b5cf6);
    --good: #34d399;
    --bad: #f87171;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--page); scroll-behavior: smooth; }
  body {
    background: var(--page); color: var(--tp);
    font-family: -apple-system, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, "Microsoft YaHei", sans-serif;
    font-size: 13px; padding: 0 18px 28px; min-width: 500px;
    max-width: 1460px; margin: 0 auto;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- 导航 ---------- */
  .topbar {
    position: sticky; top: 10px; z-index: 30;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: linear-gradient(180deg, rgba(21,26,35,.92), rgba(16,20,27,.92));
    border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.05);
    padding: 9px 14px; margin: 12px 0 14px;
  }
  .brand { display: flex; align-items: baseline; gap: 9px; margin-right: auto; }
  .brand b { font-size: 15px; font-weight: 700; letter-spacing: -.2px; white-space: nowrap; }
  #status { color: var(--tm); font-size: 11px; white-space: nowrap; }
  .ring { width: 28px; height: 28px; cursor: pointer; flex: none; }
  .ring circle { fill: none; stroke-width: 2.5; }
  .ring .bg { stroke: var(--track); }
  .ring .fg { stroke: var(--cyan); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .ring text { fill: var(--tm); font-size: 9px; text-anchor: middle; dominant-baseline: central; }
  .seg { display: flex; gap: 2px; border: 1px solid var(--line); border-radius: 10px; padding: 3px; flex: none; background: var(--chip); }
  .seg button {
    background: none; border: none; color: var(--ts); padding: 5px 12px;
    cursor: pointer; font-size: 12px; font-family: inherit; border-radius: 7px;
    transition: background .18s, color .18s;
  }
  .seg button:hover { background: var(--chip-hover); color: var(--tp); }
  .seg button.on { background: var(--grad); color: #fff; font-weight: 600; }
  .gear {
    background: var(--chip); border: 1px solid var(--line); border-radius: 10px;
    width: 32px; height: 32px; color: var(--ts); cursor: pointer; font-size: 14px; flex: none;
    transition: background .18s, border-color .18s;
  }
  .gear:hover { background: var(--chip-hover); border-color: var(--line-strong); }

  /* ---------- Hero:大数字 + 发光面积图 + 漫游卡 ---------- */
  .hero {
    position: relative; height: 440px; border-radius: 18px; overflow: hidden;
    background: var(--card-g); border: 1px solid var(--line);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.05);
    margin-bottom: 14px;
  }
  .hero .dots {
    position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 22px 22px;
    -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 72%);
    mask-image: linear-gradient(180deg, #000 0%, transparent 72%);
  }
  .hero-head { position: relative; z-index: 2; padding: 30px 34px 0; max-width: 560px; }
  .eyebrow { font-size: 12px; color: var(--tm); letter-spacing: 1.2px; margin-bottom: 16px; }
  .hero-cap { font-size: 11px; font-weight: 600; letter-spacing: 3px; color: var(--tm); margin-bottom: 8px; }
  .hero-line { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .hero-num {
    font-size: 88px; font-weight: 760; letter-spacing: -3.5px; line-height: .95; color: var(--tp);
    font-family: -apple-system, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 34px rgba(34,211,238,.22);
  }
  .tchip {
    font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .tchip.up { color: var(--bad); background: rgba(248,113,113,.10); border: 1px solid rgba(248,113,113,.28); }
  .tchip.down { color: var(--good); background: rgba(52,211,153,.10); border: 1px solid rgba(52,211,153,.28); }
  .hero-sub { margin-top: 14px; font-size: 13px; color: var(--ts); }
  .hero-btns { display: flex; gap: 10px; margin-top: 20px; }
  .hbtn {
    border-radius: 10px; padding: 10px 20px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
    border: 1px solid var(--line-strong); background: rgba(255,255,255,.03); color: var(--tp);
    transition: transform .18s, box-shadow .18s, background .18s, border-color .18s;
  }
  .hbtn:hover { transform: translateY(-1px); background: var(--chip-hover); border-color: rgba(255,255,255,.24); }
  .hbtn.primary { background: var(--grad); border-color: transparent; color: #fff; box-shadow: 0 6px 20px rgba(34,211,238,.28); }
  .hbtn.primary:hover { box-shadow: 0 8px 26px rgba(139,92,246,.4); }
  #heroChart { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 210px; z-index: 1; display: block; }

  /* 漫游悬浮卡:外层 .fc 由 JS 驱动位移,内层 .fci 管旋转/hover/拖拽态 */
  .fcards { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  .fc { position: absolute; pointer-events: auto; will-change: transform; }
  .fci {
    background: linear-gradient(180deg, #1a2029, #12161e);
    border: 1px solid rgba(255,255,255,.09); border-radius: 14px;
    color: var(--tp); padding: 12px 15px; min-width: 128px; cursor: grab; user-select: none;
    box-shadow: 0 2px 6px rgba(0,0,0,.45), 0 18px 44px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07);
    transition: box-shadow .3s, border-color .3s;
    touch-action: none;
  }
  .fc:hover .fci, .fc.drag .fci {
    border-color: rgba(34,211,238,.45);
    box-shadow: 0 2px 6px rgba(0,0,0,.45), 0 22px 50px rgba(0,0,0,.55), 0 0 22px rgba(34,211,238,.14), inset 0 1px 0 rgba(255,255,255,.09);
  }
  .fc.drag .fci { cursor: grabbing; }
  .fci .fl { font-size: 10.5px; color: var(--tm); margin-bottom: 4px; white-space: nowrap; }
  .fci .fv { font-size: 19px; font-weight: 720; letter-spacing: -.4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .fci .fs { font-size: 10px; color: var(--tm); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
  .fci .row { display: flex; align-items: center; gap: 10px; }
  .fci svg.mini { display: block; }
  .fc:nth-child(1) { right: 25%; top: 12%; }
  .fc:nth-child(2) { right: 5%;  top: 20%; }
  .fc:nth-child(3) { right: 31%; top: 42%; }
  .fc:nth-child(4) { right: 10%; bottom: 26%; }
  .fc:nth-child(5) { right: 46%; top: 9%; }
  @media (max-width: 1120px) { .fc:nth-child(5) { display: none; } }
  @media (max-width: 900px) { .fc:nth-child(3) { display: none; } }
  @media (max-width: 760px) {
    .hero { height: auto; }
    .hero-head { max-width: none; }
    .hero-num { font-size: 56px; letter-spacing: -2px; }
    #heroChart { position: relative; height: 150px; margin-top: 10px; }
    .fcards { position: relative; inset: auto; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 12px 16px 20px; }
    .fc { position: static; transform: none !important; display: block !important; }
    .fci { transform: none; cursor: pointer; }
  }

  /* ---------- 卡片 ---------- */
  .card {
    background: var(--card-g); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px 18px; margin-bottom: 12px; overflow-x: auto;
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.05);
    transition: border-color .25s, box-shadow .25s, transform .6s ease, opacity .6s ease;
  }
  .card:hover { border-color: var(--line-strong); box-shadow: var(--shadow), 0 0 24px rgba(34,211,238,.06), inset 0 1px 0 rgba(255,255,255,.05); }
  .rv { opacity: 0; transform: translateY(22px); }
  .rv.in { opacity: 1; transform: none; }
  .card h2 { font-size: 12px; font-weight: 600; color: var(--ts); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; letter-spacing: .3px; }
  .card h2 .hint { color: var(--tm); font-weight: 400; font-size: 11px; margin-left: auto; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .duo .card { margin-bottom: 0; }
  @media (max-width: 660px) { .duo { grid-template-columns: 1fr; } }

  .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; color: var(--ts); font-size: 11px; }
  .legend i, .swatch { width: 9px; height: 9px; border-radius: 2.5px; display: inline-block; flex: none; }

  .mrow { display: grid; grid-template-columns: minmax(90px, 150px) 1fr 58px 56px; gap: 8px; align-items: center; padding: 4px 0; }
  .mrow .name { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .mrow .track { height: 9px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .mrow .fill { height: 100%; border-radius: 4px; transition: width .5s ease; }
  .mrow .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ts); font-size: 12px; white-space: nowrap; }

  .heat { border-spacing: 2px; border-collapse: separate; }
  .heat td { width: 22px; height: 15px; border-radius: 3px; background: var(--track); }
  .heat .rl { color: var(--tm); font-size: 10px; padding-right: 6px; background: none; white-space: nowrap; width: auto; }
  .heat .cl { color: var(--tm); font-size: 9px; text-align: center; background: none; height: auto; }

  /* 缓存命中率 Halo 仪表 */
  .cachecard { display: flex; align-items: center; gap: 30px; flex-wrap: wrap; padding: 4px 2px; }
  .halo { position: relative; width: 150px; height: 150px; flex: none; }
  .halo svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .halo .arc { fill: none; stroke: url(#haloGrad); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .9s cubic-bezier(.3,.7,.3,1); }
  .halo .arcGlow { fill: none; stroke: url(#haloGrad); stroke-width: 10; stroke-linecap: round; filter: blur(7px); opacity: .5; transition: stroke-dashoffset .9s cubic-bezier(.3,.7,.3,1); }
  .halo .trk { fill: none; stroke: var(--track); stroke-width: 10; }
  .halo .ct { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .halo .pct {
    font-size: 30px; font-weight: 700; letter-spacing: -.8px;
    font-family: -apple-system, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(135deg, #22d3ee, #8b5cf6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .halo .pl { font-size: 10.5px; color: var(--tm); margin-top: 2px; }
  .cmetrics { display: flex; gap: 30px; flex-wrap: wrap; flex: 1; min-width: 260px; }
  .cm { min-width: 130px; }
  .cm .cl { font-size: 11px; color: var(--tm); margin-bottom: 6px; }
  .cm .cv { font-size: 19px; font-weight: 650; letter-spacing: -.3px; }
  .cm .bar { margin-top: 8px; height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; max-width: 150px; }
  .cm .bar div { height: 100%; border-radius: 3px; background: var(--grad); transition: width .9s cubic-bezier(.3,.7,.3,1); }
  .cm .cs { font-size: 10.5px; color: var(--ts); margin-top: 5px; }

  .fun { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .funit { background: var(--chip); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
    transition: transform .25s ease, border-color .25s ease; will-change: transform; }
  .funit:hover { border-color: var(--line-strong); }
  .funit .fl { font-size: 11px; color: var(--tm); }
  .funit .fv { font-size: 16px; font-weight: 650; letter-spacing: -.3px; margin-top: 4px; }
  .funit .fs { font-size: 10.5px; color: var(--ts); margin-top: 3px; }

  table.sess { width: 100%; border-collapse: collapse; font-size: 12px; }
  .sess th { text-align: left; color: var(--tm); font-weight: 500; font-size: 11px; padding: 5px 7px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
  .sess td { padding: 8px 7px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .sess td.num, .sess th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .sess tbody tr { cursor: pointer; transition: background .12s; }
  .sess tbody tr:hover { background: var(--row-hover); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.18); }
  .dot.live { background: var(--good); animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(52,211,153,.5); } 100% { box-shadow: 0 0 0 7px rgba(52,211,153,0); } }
  .app-tag { font-size: 10px; padding: 2px 7px; border-radius: 7px; border: 1px solid var(--line); color: var(--ts); white-space: nowrap; background: var(--chip); }
  .app-tag.claude { color: #7db2ef; border-color: rgba(57,135,229,.4); background: rgba(57,135,229,.08); }
  .app-tag.agent  { color: #aaa2ee; border-color: rgba(144,133,233,.4); background: rgba(144,133,233,.08); }
  .app-tag.codex  { color: #4dc397; border-color: rgba(25,158,112,.4); background: rgba(25,158,112,.08); }
  .app-tag.gemini { color: #e0b25c; border-color: rgba(201,133,0,.45); background: rgba(201,133,0,.08); }
  .app-tag.opencode { color: #e58bad; border-color: rgba(213,81,129,.45); background: rgba(213,81,129,.08); }
  .app-tag.continue { color: #ee9c9c; border-color: rgba(230,103,103,.45); background: rgba(230,103,103,.08); }
  .ellip { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .muted { color: var(--tm); }

  #tip {
    position: fixed; pointer-events: none; display: none; z-index: 50;
    background: rgba(20,25,34,.96); border: 1px solid var(--line-strong); border-radius: 12px;
    padding: 9px 11px; font-size: 11px; max-width: 270px;
    box-shadow: 0 12px 34px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
  }
  #tip .t { color: var(--tp); font-weight: 600; margin-bottom: 4px; }
  #tip .r { display: flex; justify-content: space-between; gap: 14px; color: var(--ts); padding: 1.5px 0; }
  #tip .r i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 5px; }

  #drawer {
    position: fixed; top: 0; right: -540px; width: 520px; max-width: 92vw; height: 100vh; z-index: 40;
    background: linear-gradient(180deg, #151a23, #0e1218); border-left: 1px solid var(--line-strong);
    transition: right .2s ease; padding: 18px; overflow-y: auto;
    box-shadow: -16px 0 50px rgba(0,0,0,.6);
  }
  #drawer.open { right: 0; }
  #drawer .close { float: right; background: none; border: none; color: var(--tm); font-size: 18px; cursor: pointer; }
  #drawer h3 { font-size: 15px; font-weight: 650; letter-spacing: -.2px; margin-bottom: 6px; }
  #drawer .meta { color: var(--tm); font-size: 11px; margin-bottom: 12px; word-break: break-all; line-height: 1.5; }
  .tokbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 8px 0 12px; background: var(--track); }
  .tokbar div { height: 100%; }
  .ev { border-left: 2px solid rgba(255,255,255,.14); padding: 4px 0 4px 10px; margin-bottom: 7px; }
  .ev.command { border-left-color: var(--series-4); }
  .ev .ts { color: var(--tm); font-size: 10px; }
  .ev .tx { color: var(--ts); font-size: 12px; white-space: pre-wrap; word-break: break-word; line-height: 1.45; }
  .ev.command .tx { color: var(--series-4); font-family: Consolas, monospace; }
  .fade { animation: fadein .3s ease; }
  @keyframes fadein { from { opacity: .4; } to { opacity: 1; } }

  /* 定价编辑器 */
  #modal {
    position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center;
    background: rgba(4,6,10,.6);
  }
  #modal.open { display: flex; }
  .mbox {
    width: 660px; max-width: 94vw; max-height: 86vh; overflow-y: auto;
    background: linear-gradient(180deg, #171c26, #10141b); border: 1px solid var(--line-strong); border-radius: 16px; padding: 20px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .mbox h3 { font-size: 15px; font-weight: 650; letter-spacing: -.2px; margin-bottom: 5px; }
  .mbox .mnote { color: var(--tm); font-size: 11px; margin-bottom: 12px; line-height: 1.55; }
  table.ptab { width: 100%; border-collapse: collapse; font-size: 12px; }
  .ptab th { text-align: left; color: var(--tm); font-weight: 500; font-size: 10.5px; padding: 4px 6px 6px 2px; border-bottom: 1px solid var(--line-strong); }
  .ptab td { padding: 4px 6px 4px 0; }
  .ptab input {
    width: 100%; background: var(--chip); border: 1px solid var(--line); border-radius: 8px;
    color: var(--tp); padding: 6px 8px; font-size: 12px; font-family: Consolas, monospace; outline: none;
  }
  .ptab input:focus { border-color: var(--cyan); }
  .ptab input:disabled { opacity: .55; }
  .ptab .del { background: none; border: none; color: var(--tm); cursor: pointer; font-size: 13px; }
  .ptab .del:hover { color: var(--bad); }
  .mbtns { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
  .btn {
    border-radius: 10px; padding: 7px 16px; font-size: 12px; cursor: pointer; font-family: inherit;
    border: 1px solid var(--line); background: var(--chip); color: var(--tp);
    transition: background .18s;
  }
  .btn:hover { background: var(--chip-hover); }
  .btn.primary { background: var(--grad); border-color: transparent; font-weight: 600; color: #fff; }
  #pmsg { font-size: 11px; margin-left: auto; }

  @media (prefers-reduced-motion: reduce) {
    .dot.live { animation: none; }
    .rv { opacity: 1; transform: none; transition: none; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<nav class="topbar">
  <div class="brand">📟 <b>AI 用量监控</b><span id="status"></span></div>
  <div class="seg" id="appSeg">
    <button data-v="all" class="on">全部</button>
  </div>
  <div class="seg" id="daySeg">
    <button data-v="7" class="on">7天</button>
    <button data-v="14">14天</button>
    <button data-v="30">30天</button>
    <button data-v="90">90天</button>
  </div>
  <button class="gear" id="gearBtn" title="自定义定价">⚙️</button>
  <svg class="ring" id="ring" viewBox="0 0 26 26" title="点击立即刷新">
    <circle class="bg" cx="13" cy="13" r="10.5"></circle>
    <circle class="fg" cx="13" cy="13" r="10.5" transform="rotate(-90 13 13)"></circle>
    <text x="13" y="13.5" id="ringT">30</text>
  </svg>
</nav>

<section class="hero" id="hero">
  <div class="dots"></div>
  <svg id="heroChart"></svg>
  <div class="hero-head">
    <div class="eyebrow" id="heroGreet"></div>
    <div class="hero-cap">今日成本</div>
    <div class="hero-line">
      <span class="hero-num" id="heroNum">$0</span>
      <span id="heroTrend"></span>
    </div>
    <div class="hero-sub" id="heroSub"></div>
    <div class="hero-btns">
      <button class="hbtn primary" onclick="document.getElementById('sessCard').scrollIntoView({behavior:'smooth'})">💬 会话记录</button>
      <button class="hbtn" onclick="openPricing()">⚙️ 自定义定价</button>
    </div>
  </div>
  <div class="fcards" id="fcards"></div>
</section>

<div class="card" id="chartCard">
  <h2>📊 每日成本 · 按模型 <span class="hint">悬停查看明细</span></h2>
  <svg id="chart" width="100%" height="200"></svg>
  <div class="legend" id="legend"></div>
</div>

  <h2>🕐 活动热力图 <span class="hint">什么时间烧钱最多（按小时成本）</span></h2>
  <div style="overflow-x:auto"><table class="heat" id="heat"></table></div>
</div>

<div class="card" id="cacheCard">
  <h2>🧊 缓存效率 <span class="hint">命中率 = 缓存读取 ÷ 全部输入token</span></h2>
  <div class="cachecard">
    <div class="halo">
      <svg viewBox="0 0 150 150">
        <defs>
          <linearGradient id="haloGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/>
          </linearGradient>
        </defs>
        <circle class="trk" cx="75" cy="75" r="64"></circle>
        <circle class="arcGlow" id="haloGlow" cx="75" cy="75" r="64"></circle>
        <circle class="arc" id="haloArc" cx="75" cy="75" r="64"></circle>
      </svg>
      <div class="ct"><div class="pct" id="haloP">–</div><div class="pl">缓存命中率</div></div>

  </div>
</div>

  </div>

    <div class="fun" id="funList"></div>

</div>

<div class="card" id="sessCard">
  <h2>💬 会话记录 <span class="hint">每个终端窗口一行 · 点击看全部命令与输入</span></h2>
  <table class="sess">

      <th></th><th>最后活动</th><th>来源</th><th>模型</th><th>目录</th><th>首条输入</th>

    <table class="ptab">
      <thead><tr><th>匹配模式</th><th>输入</th><th>输出</th><th>缓存写</th><th>缓存读</th><th></th></tr></thead>
      <tbody id="pBody"></tbody>
    </table>

      <button class="btn" id="pAdd">＋ 添加条目</button>
      <button class="btn primary" id="pSave">保存</button>
      <button class="btn" onclick="modal.classList.remove('open')">取消</button>
      <span id="pmsg"></span>
    </div>

</div>

<script>
const SLOTS = ['--series-1','--series-2','--series-3','--series-4','--series-5','--series-6','--series-7','--series-8'];
const OTHER_COLOR = '#5f6b7d';
const REFRESH_S = 30;
let DATA = null, appFilter = 'all', days = 7, colorMap = new Map(), countdown = REFRESH_S;
const $ = id => document.getElementById(id);
const tip = $('tip'), drawer = $('drawer'), hero = $('hero');
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FINE = matchMedia('(pointer:fine)').matches;

function fmtCost(c) { return '$' + (c >= 1000 ? (c/1000).toFixed(2)+'k' : c >= 100 ? c.toFixed(0) : c >= 10 ? c.toFixed(1) : c.toFixed(2)); }
function fmtTok(t) {
  if (t >= 1e9) return (t/1e9).toFixed(2) + 'B';
  if (t >= 1e6) return (t/1e6).toFixed(1) + 'M';
  if (t >= 1e3) return (t/1e3).toFixed(1) + 'k';
  return String(t);
}
function fmtTime(ts) {
  const d = new Date(ts), now = Date.now(), diff = now - ts;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
  const hm = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  if (d.toDateString() === new Date().toDateString()) return hm;
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' + hm;
}
function tokSum(u) { return u.in + u.cw + u.cr + u.out; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function coffee(c) { const n = c / 2.5; return n < 1 ? '' : '≈ ' + (n >= 100 ? Math.round(n) : n.toFixed(1)) + ' 杯咖啡'; }

function greeting() {
  const h = new Date().getHours();
  if (h < 6) return ['🌙 夜深了', '还在肝吗？注意休息'];
  if (h < 12) return ['☀️ 早上好', '新的一天，从看看昨天烧了多少钱开始'];
  if (h < 18) return ['📟 下午好', '监控运转中'];
  return ['🌆 晚上好', '今天的战况如下'];
}

/* ---------- 数字 count-up ---------- */
const prevNums = new Map();
function countTo(el, val, fmt) {
  const key = el.id || el.dataset.k || Math.random();
  const from = prevNums.get(key);
  prevNums.set(key, val);
  if (REDUCED || from === undefined || from === val) { el.textContent = fmt(val); return; }
  const t0 = performance.now();
  (function step(t) {
    const p = Math.min(1, (t - t0) / 650);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(from + (val - from) * e);
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}

function colorOf(model) { return colorMap.get(model) || OTHER_COLOR; }
function appOK(app) { return appFilter === 'all' || app === appFilter; }
function appName(id) { const a = (DATA.apps || []).find(a => a.id === id); return a ? a.name : id; }

function assignColors(models) {
  colorMap = new Map();
  models.slice(0, 8).forEach((m, i) => colorMap.set(m.model, css(SLOTS[i])));
}

// 数据源筛选按钮根据实际有数据的工具动态生成
function buildAppSeg() {
  const seg = $('appSeg');
  const want = ['all', ...(DATA.apps || []).map(a => a.id)];
  const have = [...seg.children].map(b => b.dataset.v);
  if (want.join() !== have.join()) {
    seg.innerHTML = '<button data-v="all">全部</button>' +
      (DATA.apps || []).map(a => `<button data-v="${esc(a.id)}">${esc(a.name)}</button>`).join('');
  }
  if (!want.includes(appFilter)) appFilter = 'all';
  [...seg.children].forEach(b => b.classList.toggle('on', b.dataset.v === appFilter));
}

function filteredDaily() {
  return DATA.daily.map(d => {
    const byModel = {};
    for (const [app, models] of Object.entries(d.byApp)) {
      if (!appOK(app)) continue;
      for (const [m, u] of Object.entries(models)) {
        if (!byModel[m]) byModel[m] = { cost: 0, tok: 0 };
        byModel[m].cost += u.cost; byModel[m].tok += tokSum(u);
      }
    }
    return { date: d.date, byModel };
  });
}

function showTip(ev, html) {
  tip.innerHTML = html;
  tip.style.display = 'block';
  tip.style.left = Math.min(ev.clientX + 12, innerWidth - 290) + 'px';
  tip.style.top = Math.min(ev.clientY + 12, innerHeight - 120) + 'px';
}
function hideTip() { tip.style.display = 'none'; }

function render() {
  if (!DATA) return;
  buildAppSeg();
  assignColors(DATA.models);
  const daily = filteredDaily();
  const sessions = DATA.sessions.filter(s => appOK(s.app));
  const models = DATA.models
    .map(m => {
      if (appFilter === 'all') return { model: m.model, cost: m.cost, tokens: m.tokens };
      const u = m.byApp[appFilter];
      return { model: m.model, cost: u ? u.cost : 0, tokens: u ? tokSum(u) : 0 };
    })
    .filter(m => m.cost > 0.0001 || m.tokens > 0)
    .sort((a, b) => b.cost - a.cost);

  let rangeCost = 0, todayCost = 0;
  for (const d of daily) for (const u of Object.values(d.byModel)) rangeCost += u.cost;
  const today = daily.find(d => d.date === DATA.todayStr);
  if (today) for (const u of Object.values(today.byModel)) todayCost += u.cost;
  const activeN = sessions.filter(s => s.active).length;
  const avgDaily = rangeCost / Math.max(1, daily.length);

  document.title = `AI 用量 · 今日 ${fmtCost(todayCost)}`;
  renderHero({ todayCost, rangeCost, avgDaily, activeN, models, daily });
  renderHeroChart(daily);
  renderChart(daily);
  renderHeat();
  renderBars('modelList', models.map(m => ({
    name: m.model, color: colorOf(m.model), v: m.cost, right1: fmtTok(m.tokens), right2: fmtCost(m.cost),
  })));
  $('modelCount').textContent = '共 ' + models.length + ' 个模型';
  renderBars('projList', DATA.projects.map(p => ({
    name: p.name, color: css('--series-7'), v: p.cost, right1: p.sessions + ' 会话', right2: fmtCost(p.cost),
  })));
  renderBars('cmdList', DATA.commands.map(c => ({
    name: c.name, color: css('--series-4'), v: c.count, right1: '', right2: c.count + ' 次', mono: true,
  })));
  renderCache();
  renderFun();
  renderSessions(sessions);
  $('status').textContent = '更新于 ' + fmtTime(DATA.generatedAt);
}

/* ---------- Hero:问候 + 大数字 + 趋势徽章 + 漫游卡 ---------- */
function renderHero(x) {
  const [g, gs] = greeting();
  $('heroGreet').textContent = g + ' · ' + gs;
  countTo($('heroNum'), x.todayCost, v => fmtCost(v));
  // vs 昨天趋势徽章
  const totals = x.daily.map(d => Object.values(d.byModel).reduce((a, u) => a + u.cost, 0));
  const ti = x.daily.findIndex(d => d.date === DATA.todayStr);
  let trendHtml = '';
  if (ti > 0 && totals[ti - 1] > 0.01) {
    const pct = (totals[ti] - totals[ti - 1]) / totals[ti - 1] * 100;
    const up = pct >= 0;
    trendHtml = `<span class="tchip ${up ? 'up' : 'down'}">${up ? '↑' : '↓'} ${Math.abs(pct).toFixed(0)}% vs 昨天</span>`;
  }
  $('heroTrend').innerHTML = trendHtml;
  $('heroSub').textContent = `${days}天共 ${fmtCost(x.rangeCost)} · 日均 ${fmtCost(x.avgDaily)} · 照此本月约 ${fmtCost(x.avgDaily * 30)}` + (coffee(x.todayCost) ? ' · 今日' + coffee(x.todayCost) : '');

  const allIds = (DATA.apps || []).map(a => a.id);
  const cache = cacheAgg(appFilter === 'all' ? allIds : [appFilter]);
  const top = x.models[0];
  const MINI_C = (2 * Math.PI * 15).toFixed(1);
  const miniOff = (2 * Math.PI * 15 * (1 - cache.rate)).toFixed(1);
  const cards = [
    { go: 'cacheCard', html: `<div class="row"><svg class="mini" width="38" height="38" viewBox="0 0 38 38">
        <circle cx="19" cy="19" r="15" fill="none" stroke="var(--track)" stroke-width="4.5"/>
        <circle cx="19" cy="19" r="15" fill="none" stroke="url(#haloGrad)" stroke-width="4.5" stroke-linecap="round"
          stroke-dasharray="${MINI_C}" stroke-dashoffset="${miniOff}" transform="rotate(-90 19 19)"/>
      </svg><div><div class="fl">缓存命中率</div><div class="fv">${(cache.rate * 100).toFixed(1)}%</div></div></div>` },
    { go: 'chartCard', html: `<div class="fl">${days}天成本</div><div class="fv">${fmtCost(x.rangeCost)}</div>
      <div class="fs">日均 ${fmtCost(x.avgDaily)}</div>` },
    { go: 'sessCard', html: `<div class="fl">活跃会话</div><div class="row"><span class="dot${x.activeN ? ' live' : ''}"></span><span class="fv">${x.activeN}</span></div>
      <div class="fs">${x.activeN ? '正在输出中' : '当前无活动'}</div>` },
    { go: 'modelCard', html: `<div class="fl">👑 Top 模型</div><div class="fv" style="font-size:14.5px">${esc(top ? top.model.slice(0, 18) : '–')}</div>
      <div class="fs">${top ? fmtCost(top.cost) + ' · ' + fmtTok(top.tokens) : ''}</div>` },
    { go: 'cacheCard', html: `<div class="fl">缓存帮你省了</div><div class="fv">${fmtCost(DATA.stats.savedByCache)}</div><div class="fs">若无缓存要多花这么多</div>` },
  ];
  $('fcards').innerHTML = cards.map(c =>
    `<div class="fc"><div class="fci" data-go="${c.go}">${c.html}</div></div>`).join('');
  initFloat();
}

/* ---------- Hero 发光面积图(每日总成本) ---------- */
let heroDrawn = false;
function renderHeroChart(daily) {
  const svg = $('heroChart');
  const W = svg.clientWidth || 1000, H = svg.clientHeight || 210;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = '';
  const vals = daily.map(d => Object.values(d.byModel).reduce((a, u) => a + u.cost, 0));
  if (vals.length < 2) return;
  const max = Math.max(0.01, ...vals);
  const padT = 18, padB = 6;
  const px = i => i / (vals.length - 1) * W;
  const py = v => padT + (1 - v / max) * (H - padT - padB);
  const pts = vals.map((v, i) => [px(i), py(v)]);

  // Catmull-Rom → 三次贝塞尔,平滑曲线
  let line = `M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    line += ` C ${c1[0].toFixed(1)} ${c1[1].toFixed(1)}, ${c2[0].toFixed(1)} ${c2[1].toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  const area = line + ` L ${W} ${H} L 0 ${H} Z`;

  const ns = 'http://www.w3.org/2000/svg';
  const el = (t, attrs) => { const e = document.createElementNS(ns, t); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  const defs = el('defs', {});
  defs.innerHTML = `
    <linearGradient id="hgStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="hgFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".20"/>
      <stop offset=".55" stop-color="#8b5cf6" stop-opacity=".07"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <filter id="hgBlur" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>`;
  svg.appendChild(defs);
  svg.appendChild(el('path', { d: area, fill: 'url(#hgFill)' }));
  const glow = el('path', { d: line, fill: 'none', stroke: 'url(#hgStroke)', 'stroke-width': 3, filter: 'url(#hgBlur)', opacity: .7 });
  const main = el('path', { d: line, fill: 'none', stroke: 'url(#hgStroke)', 'stroke-width': 2.2, 'stroke-linecap': 'round' });
  svg.appendChild(glow);
  svg.appendChild(main);

  // 首次载入描画动画
  if (!heroDrawn && !REDUCED) {
    heroDrawn = true;
    for (const p of [glow, main]) {
      const len = p.getTotalLength ? p.getTotalLength() : 2000;
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = len;
      p.style.transition = 'stroke-dashoffset 1.3s cubic-bezier(.4,.2,.2,1)';
      requestAnimationFrame(() => requestAnimationFrame(() => { p.style.strokeDashoffset = 0; }));
    }
  }

  // crosshair + tooltip
  const cross = el('line', { y1: padT - 8, y2: H, stroke: 'rgba(255,255,255,.22)', 'stroke-width': 1, 'stroke-dasharray': '3 3', visibility: 'hidden' });
  const mark = el('circle', { r: 4, fill: '#0a0d12', stroke: 'url(#hgStroke)', 'stroke-width': 2.4, visibility: 'hidden' });
  svg.appendChild(cross); svg.appendChild(mark);
  const hit = el('rect', { x: 0, y: 0, width: W, height: H, fill: 'transparent' });
  hit.addEventListener('mousemove', ev => {
    const r = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(vals.length - 1, Math.round((ev.clientX - r.left) / r.width * (vals.length - 1))));
    const [cx, cy] = pts[i];
    cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('visibility', 'visible');
    mark.setAttribute('cx', cx); mark.setAttribute('cy', cy); mark.setAttribute('visibility', 'visible');
    showTip(ev, `<div class="t">${daily[i].date}</div><div class="r"><span>总成本</span><b>${fmtCost(vals[i])}</b></div>`);
  });
  hit.addEventListener('mouseleave', () => { cross.setAttribute('visibility', 'hidden'); mark.setAttribute('visibility', 'hidden'); hideTip(); });
  svg.appendChild(hit);
}

/* ---------- 漫游 + 视差 + 拖拽物理(单 rAF 循环) ---------- */
// 每张卡的 Lissajous 参数:振幅/角频率/相位 + 摇摆 + 视差深度,固定不随刷新变
const FPARAMS = [
  { ax: 16, ay: 12, w1: .52, w2: .40, p1: 0.0, p2: 1.3, ra: 2.2, rw: .30, rp: 0.5, rb: -7, d: 1.4 },
  { ax: 12, ay: 18, w1: .38, w2: .55, p1: 2.1, p2: 0.4, ra: 1.8, rw: .26, rp: 2.2, rb: 5,  d: 1.0 },
  { ax: 20, ay: 10, w1: .45, w2: .62, p1: 4.0, p2: 2.8, ra: 2.4, rw: .34, rp: 4.1, rb: 6,  d: 1.25 },
  { ax: 14, ay: 15, w1: .60, w2: .35, p1: 1.0, p2: 5.0, ra: 1.6, rw: .22, rp: 1.7, rb: -5, d: .8 },
  { ax: 10, ay: 13, w1: .34, w2: .48, p1: 5.2, p2: 3.5, ra: 2.0, rw: .28, rp: 3.3, rb: 3,  d: .6 },
];
let floats = [];
let mx = 0, my = 0, cmx = 0, cmy = 0;
const FLOAT_ON = !REDUCED && FINE;

function initFloat() {
  floats = [...document.querySelectorAll('#fcards .fc')].map((el, i) => ({
    el, fci: el.querySelector('.fci'), p: FPARAMS[i % FPARAMS.length],
    k: 1, drag: { on: false, x: 0, y: 0, vx: 0, vy: 0, px: 0, py: 0, startX: 0, startY: 0, moved: 0 },
  }));
  if (!FLOAT_ON) floats.forEach(f => { f.fci.style.transform = `rotate(${f.p.rb}deg)`; });
}
function floatLoop(now) {
  const t = now / 1000;
  cmx += (mx - cmx) * .06; cmy += (my - cmy) * .06;
  for (const f of floats) {
    const p = f.p, d = f.drag;
    const wantK = (d.on || f.el.matches(':hover')) ? 0 : 1;
    f.k += (wantK - f.k) * .08;
    const wx = Math.sin(p.w1 * t + p.p1) * p.ax * f.k;
    const wy = Math.sin(p.w2 * t + p.p2) * p.ay * f.k;
    const px = cmx * p.d * 26, py = cmy * p.d * 20;
    if (!d.on && (Math.abs(d.x) > .3 || Math.abs(d.y) > .3 || Math.abs(d.vx) > .3 || Math.abs(d.vy) > .3)) {
      const K = 90, C = 16, dt = 1 / 60;
      d.vx += (-K * d.x - C * d.vx) * dt; d.vy += (-K * d.y - C * d.vy) * dt;
      d.x += d.vx * dt; d.y += d.vy * dt;
    } else if (!d.on) { d.x = d.y = d.vx = d.vy = 0; }
    f.el.style.transform = `translate3d(${(wx + px + d.x).toFixed(2)}px, ${(wy + py + d.y).toFixed(2)}px, 0)`;
    const rot = p.rb * f.k + Math.sin(p.rw * t * 2 + p.rp) * p.ra * f.k;
    const scale = d.on ? 1.06 : (1 - f.k) > .5 ? 1.05 : 1;
    f.fci.style.transform = `rotate(${rot.toFixed(2)}deg) scale(${scale})`;
  }
  requestAnimationFrame(floatLoop);
}
if (FLOAT_ON) {
  requestAnimationFrame(floatLoop);
  hero.addEventListener('mousemove', e => {
    const r = hero.getBoundingClientRect();
    mx = (e.clientX - r.left) / r.width - 0.5;
    my = (e.clientY - r.top) / r.height - 0.5;
  });
  hero.addEventListener('mouseleave', () => { mx = 0; my = 0; });
  $('fcards').addEventListener('pointerdown', e => {
    const fci = e.target.closest('.fci');
    if (!fci) return;
    const f = floats.find(x => x.fci === fci);
    if (!f) return;
    e.preventDefault();
    fci.setPointerCapture(e.pointerId);
    const d = f.drag;
    d.on = true; d.moved = 0; d.startX = e.clientX; d.startY = e.clientY;
    d.px = e.clientX - d.x; d.py = e.clientY - d.y;
    f.el.classList.add('drag');
  });
  $('fcards').addEventListener('pointermove', e => {
    const f = floats.find(x => x.drag.on);
    if (!f) return;
    const d = f.drag;
    const nx = e.clientX - d.px, ny = e.clientY - d.py;
    d.vx = (nx - d.x) * 14; d.vy = (ny - d.y) * 14;
    d.x = nx; d.y = ny;
    d.moved = Math.max(d.moved, Math.hypot(e.clientX - d.startX, e.clientY - d.startY));
  });
  const endDrag = () => {
    const f = floats.find(x => x.drag.on);
    if (!f) return;
    f.drag.on = false;
    f.el.classList.remove('drag');
    if (f.drag.moved < 6) {
      const go = f.fci.dataset.go;
      if (go) $(go).scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  };
  $('fcards').addEventListener('pointerup', endDrag);
  $('fcards').addEventListener('pointercancel', endDrag);
} else {
  $('fcards').addEventListener('click', e => {
    const c = e.target.closest('[data-go]');
    if (c) $(c.dataset.go).scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
}

/* 趣味统计小卡 3D tilt */
if (FLOAT_ON) {
  document.addEventListener('pointermove', e => {
    const el = e.target.closest && e.target.closest('.funit');
    document.querySelectorAll('.funit').forEach(f => { if (f !== el) f.style.transform = ''; });
    if (!el) return;
    const r = el.getBoundingClientRect();
    const rx = ((e.clientY - r.top) / r.height - 0.5) * -7;
    const ry = ((e.clientX - r.left) / r.width - 0.5) * 7;
    el.style.transform = `perspective(500px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) translateY(-1px)`;
  });
}

function renderBars(id, rows) {
  const max = Math.max(0.0001, ...rows.map(r => r.v));
  $(id).innerHTML = rows.map(r => `
    <div class="mrow">
      <div class="name" title="${esc(r.name)}" ${r.mono ? 'style="font-family:Consolas,monospace"' : ''}><span class="swatch" style="background:${r.color}"></span>${esc(r.name)}</div>
      <div class="track"><div class="fill" style="width:${(r.v / max * 100).toFixed(1)}%;background:${r.color}"></div></div>
      <div class="num">${r.right1}</div>
      <div class="num">${r.right2}</div>
    </div>`).join('') || '<div class="muted">该范围内无数据</div>';
}

function renderChart(daily) {
  const svg = $('chart');
  const W = svg.clientWidth || 700, H = 200, padL = 46, padB = 20, padT = 8;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = '';
  const maxCost = Math.max(0.01, ...daily.map(d => Object.values(d.byModel).reduce((a, u) => a + u.cost, 0)));
  const plotW = W - padL - 8, plotH = H - padT - padB;
  const bw = Math.min(46, plotW / Math.max(1, daily.length) * 0.62);
  const step = plotW / Math.max(1, daily.length);
  const ns = 'http://www.w3.org/2000/svg';
  const el = (t, attrs) => { const e = document.createElementNS(ns, t); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

  for (let i = 0; i <= 3; i++) {
    const v = maxCost / 3 * i, y = padT + plotH - plotH * i / 3;
    svg.appendChild(el('line', { x1: padL, x2: W - 8, y1: y, y2: y, stroke: css('--track'), 'stroke-width': 1 }));
    const t = el('text', { x: padL - 6, y: y + 3, 'text-anchor': 'end', fill: css('--tm'), 'font-size': 10 });
    t.textContent = '$' + (v >= 100 ? v.toFixed(0) : v.toFixed(v >= 10 ? 0 : 1));
    svg.appendChild(t);
  }
  svg.appendChild(el('line', { x1: padL, x2: W - 8, y1: padT + plotH, y2: padT + plotH, stroke: 'rgba(255,255,255,.14)', 'stroke-width': 1 }));

  const modelOrder = [...colorMap.keys()];
  daily.forEach((d, i) => {
    const x = padL + step * i + (step - bw) / 2;
    let y = padT + plotH;
    const ordered = Object.entries(d.byModel).sort((a, b) => {
      const ia = modelOrder.indexOf(a[0]), ib = modelOrder.indexOf(b[0]);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
    const segs = ordered.map(([m, u]) => ({ m, u, h: u.cost / maxCost * plotH })).filter(s => s.h >= 0.5);
    segs.forEach((s, j) => {
      const gap = j < segs.length - 1 ? 2 : 0;
      const h = Math.max(1, s.h - gap);
      y -= s.h;
      svg.appendChild(el('rect', { x, y, width: bw, height: h, fill: colorOf(s.m), rx: j === segs.length - 1 ? 3 : 0 }));
    });
    if (daily.length <= 10 || i % Math.ceil(daily.length / 8) === 0) {
      const t = el('text', { x: x + bw / 2, y: H - 5, 'text-anchor': 'middle', fill: css('--tm'), 'font-size': 10 });
      t.textContent = d.date.slice(5).replace('-', '/');
      svg.appendChild(t);
    }
    const hit = el('rect', { x: padL + step * i, y: padT, width: step, height: plotH, fill: 'transparent' });
    hit.addEventListener('mousemove', ev => {
      const rows = ordered.filter(([, u]) => u.cost > 0.0001).reverse()
        .map(([m, u]) => `<div class="r"><span><i style="background:${colorOf(m)}"></i>${esc(m)}</span><b>${fmtCost(u.cost)}</b></div>`).join('');
      const total = ordered.reduce((a, [, u]) => a + u.cost, 0);
      showTip(ev, `<div class="t">${d.date} · ${fmtCost(total)}</div>${rows || '<div class="r muted">无用量</div>'}`);
    });
    hit.addEventListener('mouseleave', hideTip);
    svg.appendChild(hit);
  });

  $('legend').innerHTML = [...colorMap.entries()]
    .map(([m, c]) => `<span><i style="background:${c}"></i>${esc(m)}</span>`).join('') +
    (DATA.models.length > 8 ? `<span><i style="background:${OTHER_COLOR}"></i>其他 ${DATA.models.length - 8} 个</span>` : '');
}

// 热力图冰蓝单色渐变
function heatColor(v, max) {
  if (v <= 0) return 'rgba(255,255,255,.06)';
  const t = Math.sqrt(v / max);
  const lo = [42, 62, 96], hi = [125, 211, 252];
  const c = lo.map((l, i) => Math.round(l + (hi[i] - l) * t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function renderHeat() {
  const dates = Object.keys(DATA.hourly).sort().slice(-14);
  if (!dates.length) { $('heat').innerHTML = '<tr><td class="muted">无数据</td></tr>'; return; }
  let max = 0.001;
  for (const d of dates) for (const v of DATA.hourly[d]) if (v > max) max = v;
  let html = '<tr><td class="rl"></td>' + [...Array(24)].map((_, h) => `<td class="cl">${h % 3 === 0 ? h : ''}</td>`).join('') + '</tr>';
  for (const d of dates) {
    html += `<tr><td class="rl">${d.slice(5).replace('-', '/')}</td>` + DATA.hourly[d].map((v, h) =>
      `<td style="background:${heatColor(v, max)}" data-d="${d}" data-h="${h}" data-v="${v}"></td>`).join('') + '</tr>';
  }
  $('heat').innerHTML = html;
  $('heat').addEventListener('mousemove', ev => {
    const td = ev.target.closest('td[data-v]');
    if (!td) return hideTip();
    showTip(ev, `<div class="t">${td.dataset.d} ${td.dataset.h}:00</div><div class="r"><span>成本</span><b>${fmtCost(+td.dataset.v)}</b></div>`);
  });
  $('heat').addEventListener('mouseleave', hideTip);
}

const HALO_C = 2 * Math.PI * 64;
function cacheAgg(appIds) {
  let inn = 0, cw = 0, cr = 0;
  for (const m of DATA.models) for (const app of appIds) {
    const u = m.byApp[app];
    if (!u) continue;
    inn += u.in; cw += u.cw; cr += u.cr;
  }
  const denom = inn + cw + cr;
  return { in: inn, cw, cr, rate: denom > 0 ? cr / denom : 0 };
}
function renderCache() {
  const allIds = (DATA.apps || []).map(a => a.id);
  const main = cacheAgg(appFilter === 'all' ? allIds : [appFilter]);
  const off = HALO_C * (1 - main.rate);
  for (const id of ['haloArc', 'haloGlow']) {
    const el = $(id);
    el.setAttribute('stroke-dasharray', HALO_C);
    el.setAttribute('stroke-dashoffset', off);
  }
  $('haloP').textContent = (main.rate * 100).toFixed(1) + '%';
  const perApp = (DATA.apps || [])
    .map(a => ({ name: a.name, ...cacheAgg([a.id]) }))
    .filter(r => r.in + r.cw + r.cr > 0).slice(0, 4);
  $('cacheMetrics').innerHTML = [
    ...perApp.map(r => ({ cl: r.name + ' 命中率', cv: (r.rate * 100).toFixed(1) + '%', w: r.rate, cs: '读取 ' + fmtTok(r.cr) })),
    { cl: '累计缓存读取', cv: fmtTok(main.cr), w: null, cs: '省下约 ' + fmtCost(DATA.stats.savedByCache) },
  ].map(m => `<div class="cm">
      <div class="cl">${m.cl}</div><div class="cv">${m.cv}</div>
      ${m.w !== null ? `<div class="bar"><div style="width:${(m.w * 100).toFixed(1)}%"></div></div>` : ''}
      <div class="cs">${m.cs}</div>
    </div>`).join('');
}

function renderFun() {
  const s = DATA.stats;
  const night = (s.nightShare * 100).toFixed(0);
  const owl = night >= 30 ? '重度夜猫 🌙' : night >= 10 ? '偶尔熬夜' : '作息健康 ✨';
  $('funList').innerHTML = [
    { fl: '🔥 连续活跃', fv: s.streak + ' 天', fs: s.streak >= 7 ? '全勤打工人' : '' },
    { fl: '💸 最烧钱的一天', fv: s.maxDay ? fmtCost(s.maxDay.cost) : '–', fs: s.maxDay ? s.maxDay.date.slice(5).replace('-', '/') + (coffee(s.maxDay.cost) ? ' · ' + coffee(s.maxDay.cost) : '') : '' },
    { fl: '👑 最贵会话', fv: s.maxSession ? fmtCost(s.maxSession.cost) : '–', fs: s.maxSession ? esc(s.maxSession.title.slice(0, 26)) : '' },
    { fl: '🦉 夜猫指数', fv: night + '%', fs: owl + '（0-6点占比）' },
    { fl: '✍️ 累计输入', fv: s.promptTotal + ' 条', fs: '外加 ' + s.cmdTotal + ' 条命令' },
  ].map(f => `<div class="funit"><div class="fl">${f.fl}</div><div class="fv">${f.fv}</div><div class="fs">${f.fs}</div></div>`).join('');
}

function renderSessions(sessions) {
  $('sessBody').innerHTML = sessions.slice(0, 150).map((s, i) => {
    const dir = s.cwd ? s.cwd.split(/[\\/]/).filter(Boolean).pop() : '–';
    const cls = s.agent ? 'agent' : s.app;
    const src = s.agent ? '子代理' : appName(s.app);
    return `<tr data-i="${i}">
      <td><span class="dot${s.active ? ' live' : ''}"></span></td>
      <td class="muted" style="white-space:nowrap">${fmtTime(s.end)}</td>
      <td><span class="app-tag ${cls}">${src}</span></td>
      <td class="ellip" style="max-width:120px" title="${esc(s.models.join(', '))}">${esc(s.models.map(m => m.replace('claude-','')).join(', ')) || '–'}</td>
      <td class="ellip" style="max-width:100px" title="${esc(s.cwd || '')}">${esc(dir)}</td>
      <td class="ellip" title="${esc(s.title)}">${esc(s.title)}</td>
      <td class="num">${s.promptCount}</td>
      <td class="num">${s.cmdCount}</td>
      <td class="num">${fmtTok(tokSum(s.u))}</td>
      <td class="num">${fmtCost(s.u.cost)}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="10" class="muted">无会话</td></tr>';
  [...$('sessBody').querySelectorAll('tr[data-i]')].forEach(r =>
    r.addEventListener('click', () => openDrawer(sessions[+r.dataset.i])));
}

async function openDrawer(s) {
  drawer.classList.add('open');
  $('drawerBody').innerHTML = '<div class="muted">加载中…</div>';
  const res = await fetch(`/api/session?app=${s.app}&id=${encodeURIComponent(s.id)}`);
  const d = await res.json();
  const total = Math.max(1, tokSum(s.u));
  const seg = (v, c) => v > 0 ? `<div style="width:${(v/total*100).toFixed(2)}%;background:${c}" title="${fmtTok(v)}"></div>` : '';
  const evs = (d.events || []).map(e => `
    <div class="ev ${e.kind}">
      <div class="ts">${e.ts ? fmtTime(e.ts) : ''} · ${e.kind === 'command' ? '命令' : '输入'}</div>
      <div class="tx">${esc(e.text)}</div>
    </div>`).join('');
  $('drawerBody').innerHTML = `
    <h3>${esc(s.models.join(', ') || s.app)} · ${fmtCost(s.u.cost)}</h3>
    <div class="meta">${esc(s.cwd || '')}<br>会话 ${esc(s.id)} · ${fmtTok(tokSum(s.u))} tokens</div>
    <div class="tokbar">${seg(s.u.in, css('--series-1'))}${seg(s.u.cw, css('--series-2'))}${seg(s.u.cr, css('--series-3'))}${seg(s.u.out, css('--series-5'))}</div>
    <div class="legend" style="margin:-6px 0 12px">
      <span><i style="background:${css('--series-1')}"></i>输入 ${fmtTok(s.u.in)}</span>
      <span><i style="background:${css('--series-2')}"></i>缓存写 ${fmtTok(s.u.cw)}</span>
      <span><i style="background:${css('--series-3')}"></i>缓存读 ${fmtTok(s.u.cr)}</span>
      <span><i style="background:${css('--series-5')}"></i>输出 ${fmtTok(s.u.out)}</span>
    </div>
    ${evs || '<div class="muted">无输入记录</div>'}`;
}

// 刷新倒计时环
const ringFg = document.querySelector('#ring .fg');
const RING_C = 2 * Math.PI * 10.5;
ringFg.style.strokeDasharray = RING_C;
function tickRing() {
  countdown--;
  if (countdown <= 0) { load(); return; }
  ringFg.style.strokeDashoffset = RING_C * (1 - countdown / REFRESH_S);
  $('ringT').textContent = countdown;
}
setInterval(tickRing, 1000);
$('ring').addEventListener('click', load);

async function load() {
  countdown = REFRESH_S;
  ringFg.style.strokeDashoffset = 0;
  $('ringT').textContent = REFRESH_S;
  $('status').textContent = '加载中…';
  try {
    const res = await fetch('/api/data?days=' + days);
    DATA = await res.json();
    render();
  } catch (e) { $('status').textContent = '加载失败: ' + e.message; }
}

for (const [segId, setter] of [['appSeg', v => appFilter = v], ['daySeg', v => { days = +v; load(); }]]) {
  $(segId).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    [...$(segId).children].forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    setter(b.dataset.v);
    if (segId === 'appSeg') render();
  });
}

// ---- 定价编辑器 ----
const modal = $('modal');
let pComment = '';
function pRowHtml(k, v, isDefault) {
  const cell = f => `<td><input class="pv" data-f="${f}" type="number" step="any" min="0" value="${v[f] ?? 0}"></td>`;
  return `<tr>
    <td><input class="pk" value="${esc(k)}" placeholder="模型名子串" ${isDefault ? 'disabled' : ''}></td>
    ${cell('input')}${cell('output')}${cell('cacheWrite')}${cell('cacheRead')}
    <td>${isDefault ? '' : '<button class="del" title="删除">✕</button>'}</td>
  </tr>`;
}
async function openPricing() {
  try {
    const p = await (await fetch('/api/pricing')).json();
    pComment = p._comment || '';
    const keys = Object.keys(p).filter(k => !k.startsWith('_') && k !== 'default');
    $('pBody').innerHTML = keys.map(k => pRowHtml(k, p[k], false)).join('') + pRowHtml('default', p.default || {}, true);
    $('pmsg').textContent = '';
    modal.classList.add('open');
  } catch (e) { alert('读取定价失败: ' + e.message); }
}
$('gearBtn').addEventListener('click', openPricing);
$('pAdd').addEventListener('click', () => {
  $('pBody').insertAdjacentHTML('afterbegin', pRowHtml('', { input: 0, output: 0, cacheWrite: 0, cacheRead: 0 }, false));
  $('pBody').querySelector('.pk').focus();
});
$('pBody').addEventListener('click', e => {
  const b = e.target.closest('.del');
  if (b) b.closest('tr').remove();
});
$('pSave').addEventListener('click', async () => {
  const obj = {};
  if (pComment) obj._comment = pComment;
  for (const tr of $('pBody').querySelectorAll('tr')) {
    const k = tr.querySelector('.pk').value.trim();
    if (!k) continue;
    const v = {};
    for (const inp of tr.querySelectorAll('.pv')) v[inp.dataset.f] = parseFloat(inp.value) || 0;
    obj[k] = v;
  }
  try {
    const res = await fetch('/api/pricing', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj) });
    const j = await res.json();
    if (j.ok) {
      $('pmsg').textContent = '✓ 已保存，成本重算中…'; $('pmsg').style.color = 'var(--good)';
      setTimeout(() => { modal.classList.remove('open'); load(); }, 700);
    } else { $('pmsg').textContent = j.error || '保存失败'; $('pmsg').style.color = 'var(--bad)'; }
  } catch (e) { $('pmsg').textContent = '保存失败: ' + e.message; $('pmsg').style.color = 'var(--bad)'; }
});
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });

// 滚动浮现(仅首次进入视口)
if (!REDUCED) {
  const io = new IntersectionObserver(es => es.forEach(x => {
    if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); }
  }), { threshold: 0.06 });
  document.querySelectorAll('.card').forEach(c => { c.classList.add('rv'); io.observe(c); });
}

window.addEventListener('resize', () => DATA && render());
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { drawer.classList.remove('open'); modal.classList.remove('open'); }
});
load();
</script>
</body>
