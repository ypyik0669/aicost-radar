<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 用量监控</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📟</text></svg>">
<style>
  /* ---------- 主题令牌:默认深色,html[data-theme=light] 覆盖 ---------- */
  :root {
    color-scheme: dark;
    --page: #0b0c10;
    --card: rgba(255,255,255,0.055);
    --card-border: rgba(255,255,255,0.07);
    --card-hover: rgba(255,255,255,0.15);
    --card-shadow: inset 0 1px 0 rgba(255,255,255,.09), 0 8px 24px rgba(0,0,0,.3);
    --tp: #f2f3f7;
    --ts: rgba(233,236,244,0.66);
    --tm: rgba(233,236,244,0.42);
    --grid: rgba(255,255,255,0.08);
    --baseline: rgba(255,255,255,0.16);
    --chip: rgba(255,255,255,.05);
    --chip-hover: rgba(255,255,255,.10);
    --row-hover: rgba(255,255,255,.055);
    --row-border: rgba(255,255,255,.055);
    --track: rgba(255,255,255,.08);
    --tip-bg: rgba(28,30,38,.72);
    --panel: rgba(16,18,24,.82);
    --mbox: rgba(20,22,30,.88);
    --input-bg: rgba(255,255,255,.06);
    --fc-bg: rgba(20,23,32,.6);
    --fc-border: rgba(255,255,255,.14);
    --fc-text: #f2f3f7;
    --accent: #0a84ff;
    --good: #30d158;
    --blur: blur(28px) saturate(150%);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
  }
  html[data-theme="light"] {
    color-scheme: light;
    --page: #f0f3f8;
    --card: #ffffff;
    --card-border: rgba(15,30,60,0.06);
    --card-hover: rgba(15,30,60,0.14);
    --card-shadow: 0 2px 6px rgba(15,30,60,.06), 0 12px 32px rgba(15,30,60,.08);
    --tp: #17233b;
    --ts: #5b6b85;
    --tm: #93a1b8;
    --grid: rgba(23,35,59,0.08);
    --baseline: rgba(23,35,59,0.18);
    --chip: rgba(23,35,59,.05);
    --chip-hover: rgba(23,35,59,.10);
    --row-hover: rgba(10,132,255,.06);
    --row-border: rgba(23,35,59,.07);
    --track: rgba(23,35,59,.09);
    --tip-bg: rgba(255,255,255,.94);
    --panel: rgba(252,253,255,.94);
    --mbox: #ffffff;
    --input-bg: rgba(23,35,59,.05);
    --fc-bg: rgba(255,255,255,.86);
    --fc-border: rgba(255,255,255,.9);
    --fc-text: #17233b;
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--page); scroll-behavior: smooth; }
  body {
    background: transparent; color: var(--tp);
    font-family: -apple-system, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, "Microsoft YaHei", sans-serif;
    font-size: 13px; padding: 0 18px 24px; min-width: 500px;
    max-width: 1560px; margin: 0 auto;
    transition: color .3s;
  }
  /* 深色专属环境光晕 */
  .aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: radial-gradient(120% 90% at 50% 0%, #10121a 0%, #0b0c10 60%); }
  html[data-theme="light"] .aurora { background: linear-gradient(180deg, #eef2f9, #f0f3f8 40%); }
  html[data-theme="light"] .aurora i { display: none; }
  .aurora i { position: absolute; border-radius: 50%; filter: blur(100px); opacity: .38; will-change: transform; }
  .aurora i:nth-child(1) { width: 640px; height: 640px; background: #3d5bd9; top: -18%; left: -8%; animation: drift1 44s ease-in-out infinite alternate; }
  .aurora i:nth-child(2) { width: 540px; height: 540px; background: #0e7f76; top: 26%; right: -12%; animation: drift2 52s ease-in-out infinite alternate; }
  .aurora i:nth-child(3) { width: 580px; height: 580px; background: #6b3fa8; bottom: -22%; left: 28%; animation: drift3 60s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(70px, 50px) scale(1.08); } }
  @keyframes drift2 { to { transform: translate(-60px, -45px) scale(1.05); } }
  @keyframes drift3 { to { transform: translate(50px, -60px) scale(1.1); } }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(128,140,160,.35); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- 悬浮胶囊导航 ---------- */
  .topbar {
    position: sticky; top: 10px; z-index: 30;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--fc-bg); border: 1px solid var(--card-border); border-radius: 22px;
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    box-shadow: var(--card-shadow);
    padding: 9px 14px; margin: 12px 0 14px;
  }
  .brand { display: flex; align-items: baseline; gap: 9px; margin-right: auto; }
  .brand b { font-size: 15px; font-weight: 700; letter-spacing: -.2px; white-space: nowrap; }
  #status { color: var(--tm); font-size: 11px; white-space: nowrap; }
  .ring { width: 28px; height: 28px; cursor: pointer; flex: none; }
  .ring circle { fill: none; stroke-width: 2.5; }
  .ring .bg { stroke: var(--grid); }
  .ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .ring text { fill: var(--tm); font-size: 9px; text-anchor: middle; dominant-baseline: central; }
  .seg { display: flex; gap: 2px; border: 1px solid var(--card-border); border-radius: 999px; padding: 3px; flex: none; background: var(--chip); }
  .seg button {
    background: none; border: none; color: var(--ts); padding: 5px 12px;
    cursor: pointer; font-size: 12px; font-family: inherit; border-radius: 999px;
    transition: background .18s, color .18s;
  }
  .seg button:hover { background: var(--chip-hover); color: var(--tp); }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 600; box-shadow: 0 2px 8px rgba(10,132,255,.4); }
  .gear {
    background: var(--chip); border: 1px solid var(--card-border); border-radius: 999px;
    width: 32px; height: 32px; color: var(--ts); cursor: pointer; font-size: 14px; flex: none;
    transition: background .18s, color .18s;
  }
  .gear:hover { background: var(--chip-hover); color: var(--tp); }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; height: 420px; border-radius: 28px; overflow: hidden;
    margin-bottom: 14px; isolation: isolate;
    box-shadow: 0 18px 50px rgba(10,20,50,.25);
  }
  .hero .sky { position: absolute; inset: 0; z-index: 0; background: linear-gradient(180deg, #8db8e8 0%, #cfe3f2 55%, #9dc78f 78%, #6fae62 100%); }
  .hero[data-phase="dawn"] .sky { background: linear-gradient(180deg, #f4a26b 0%, #f7cf9e 50%, #a8c98a 80%, #6fae62 100%); }
  .hero[data-phase="dusk"] .sky { background: linear-gradient(180deg, #e08a4e 0%, #c76f8e 45%, #5d548f 75%, #3a4a56 100%); }
  .hero[data-phase="night"] .sky { background: linear-gradient(180deg, #0c1230 0%, #16204a 55%, #12253a 80%, #0d1c28 100%); }
  .heroimg { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: cover; transition: filter 1s; }
  .hero[data-phase="dawn"]  .heroimg { filter: brightness(.96) saturate(1.05) sepia(.14); }
  .hero[data-phase="day"]   .heroimg { filter: brightness(1.03) saturate(1.05); }
  .hero[data-phase="dusk"]  .heroimg { filter: brightness(.8) saturate(1.1) sepia(.22) hue-rotate(-12deg); }
  .hero[data-phase="night"] .heroimg { filter: brightness(.42) saturate(.65) hue-rotate(-14deg); }
  .hero .tint { position: absolute; inset: 0; z-index: 2; pointer-events: none; transition: opacity 1s; }
  .hero[data-phase="dawn"]  .tint { background: linear-gradient(180deg, rgba(255,150,90,.30), rgba(255,205,150,.10) 55%, transparent); }
  .hero[data-phase="day"]   .tint { background: linear-gradient(180deg, rgba(120,180,255,.14), transparent 60%); }
  .hero[data-phase="dusk"]  .tint { background: linear-gradient(180deg, rgba(255,135,60,.30), rgba(150,80,150,.22) 55%, rgba(40,30,80,.25)); }
  .hero[data-phase="night"] .tint { background: linear-gradient(180deg, rgba(8,14,44,.55), rgba(6,10,34,.42) 60%, rgba(4,8,24,.5)); }
  .hero .glow { position: absolute; z-index: 2; width: 480px; height: 480px; left: 50%; top: 46%; transform: translate(-50%,-50%); pointer-events: none;
    background: radial-gradient(circle, rgba(255,236,190,.55) 0%, rgba(255,220,160,.18) 35%, transparent 68%); }
  .hero[data-phase="night"] .glow { width: 300px; height: 300px; top: 24%; left: 74%;
    background: radial-gradient(circle, rgba(210,225,255,.4) 0%, rgba(180,200,255,.12) 40%, transparent 70%); }
  .hero .clouds { position: absolute; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
  .hero .clouds i { position: absolute; border-radius: 50%; background: rgba(255,255,255,.5); filter: blur(46px); opacity: .5; }
  .hero[data-phase="night"] .clouds i { background: rgba(180,195,235,.28); opacity: .35; }
  .hero .clouds i:nth-child(1) { width: 380px; height: 110px; top: 10%; left: -6%; animation: cloud1 70s linear infinite; }
  .hero .clouds i:nth-child(2) { width: 300px; height: 90px; top: 26%; right: -4%; animation: cloud2 90s linear infinite; }
  @keyframes cloud1 { 50% { transform: translateX(120px); } }
  @keyframes cloud2 { 50% { transform: translateX(-140px); } }

  .hero-inner { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #fff; padding: 0 24px; }
  .hero-inner .eyebrow { font-size: 13.5px; opacity: .92; text-shadow: 0 1px 10px rgba(0,0,0,.4); margin-bottom: 8px; letter-spacing: .3px; }
  .hero-num {
    font-size: 72px; font-weight: 760; letter-spacing: -2.5px; line-height: 1;
    font-family: -apple-system, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    text-shadow: 0 4px 26px rgba(0,0,0,.4), 0 1px 4px rgba(0,0,0,.3);
    font-variant-numeric: tabular-nums;
  }
  .hero-num .cap { display: block; font-size: 13px; font-weight: 500; letter-spacing: 1px; opacity: .85; margin-bottom: 8px; }
  .hero-sub { margin-top: 12px; font-size: 13px; opacity: .95; text-shadow: 0 1px 8px rgba(0,0,0,.45); }
  .hero-btns { display: flex; gap: 10px; margin-top: 20px; }
  .hbtn {
    border-radius: 999px; padding: 10px 22px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
    border: 1px solid rgba(255,255,255,.5); background: rgba(255,255,255,.16); color: #fff;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: background .2s, transform .2s;
  }
  .hbtn:hover { background: rgba(255,255,255,.3); transform: translateY(-1px); }
  .hbtn.primary { background: var(--accent); border-color: transparent; box-shadow: 0 6px 18px rgba(10,132,255,.45); }
  .hbtn.primary:hover { background: #2b95ff; }

  /* hero 悬浮迷你卡:外层 .fc 管视差位移,内层 .fci 管倾斜/hover */
  .fcards { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  .fc { position: absolute; pointer-events: auto; will-change: transform;
    transform: translate3d(calc(var(--mx,0) * var(--d,1) * 34px), calc(var(--my,0) * var(--d,1) * 26px), 0); }
  .fci {
    background: var(--fc-bg); border: 1px solid var(--fc-border); border-radius: 16px;
    color: var(--fc-text); padding: 12px 15px; min-width: 128px; cursor: pointer;
    backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%);
    box-shadow: 0 10px 34px rgba(10,20,50,.28), inset 0 1px 0 rgba(255,255,255,.35);
    transform: rotate(var(--r, 0deg));
    transition: transform .35s cubic-bezier(.3,.7,.3,1.2), box-shadow .35s;
  }
  .fc:hover .fci { transform: rotate(0deg) scale(1.07); box-shadow: 0 20px 50px rgba(10,20,50,.4), inset 0 1px 0 rgba(255,255,255,.45); }
  .fci .fl { font-size: 10.5px; opacity: .62; margin-bottom: 4px; white-space: nowrap; }
  .fci .fv { font-size: 19px; font-weight: 720; letter-spacing: -.4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .fci .fs { font-size: 10px; opacity: .58; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
  .fci .row { display: flex; align-items: center; gap: 10px; }
  .fci svg.mini { display: block; }
  .fc:nth-child(1) { left: 5%;  top: 15%;  --r: -8deg; --d: 1.5; }
  .fc:nth-child(2) { left: 12%; bottom: 13%; --r: 6deg;  --d: 1.0; }
  .fc:nth-child(3) { right: 14%; top: 12%; --r: 7deg;  --d: 1.25; }
  .fc:nth-child(4) { right: 5%; bottom: 20%; --r: -6deg; --d: .8; }
  .fc:nth-child(5) { left: 27%; top: 8%;  --r: 3deg;  --d: .6; }
  @media (max-width: 900px) { .fc:nth-child(5) { display: none; } }
  @media (max-width: 760px) {
    .hero { height: auto; }
    .hero-inner { position: relative; padding: 44px 20px 18px; }
    .hero-num { font-size: 52px; }
    .fcards { position: relative; inset: auto; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 0 16px 22px; }
    .fc { position: static; transform: none !important; }
    .fci { transform: none; }
  }

  /* ---------- 卡片 ---------- */
  .card {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 22px;
    padding: 16px 18px; margin-bottom: 12px; overflow-x: auto;
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    box-shadow: var(--card-shadow);
    transition: border-color .2s, opacity .6s ease, transform .6s ease;
  }
  .card:hover { border-color: var(--card-hover); }
  .rv { opacity: 0; transform: translateY(24px); }
  .rv.in { opacity: 1; transform: none; }
  .card h2 { font-size: 12px; font-weight: 600; color: var(--ts); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; letter-spacing: .3px; }
  .card h2 .hint { color: var(--tm); font-weight: 400; font-size: 11px; margin-left: auto; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .duo .card { margin-bottom: 0; }
  @media (max-width: 660px) { .duo { grid-template-columns: 1fr; } }

  .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; color: var(--ts); font-size: 11px; }
  .legend i, .swatch { width: 9px; height: 9px; border-radius: 2.5px; display: inline-block; flex: none; }

  .mrow { display: grid; grid-template-columns: minmax(90px, 150px) 1fr 58px 56px; gap: 8px; align-items: center; padding: 4px 0; }
  .mrow .name { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .mrow .track { height: 9px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .mrow .fill { height: 100%; border-radius: 4px; transition: width .5s ease; }
  .mrow .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ts); font-size: 12px; white-space: nowrap; }

  .heat { border-spacing: 2px; border-collapse: separate; }
  .heat td { width: 22px; height: 15px; border-radius: 3px; background: var(--track); }
  .heat .rl { color: var(--tm); font-size: 10px; padding-right: 6px; background: none; white-space: nowrap; width: auto; }
  .heat .cl { color: var(--tm); font-size: 9px; text-align: center; background: none; height: auto; }

  /* 缓存命中率 Halo 仪表 */
  .cachecard { display: flex; align-items: center; gap: 30px; flex-wrap: wrap; padding: 4px 2px; }
  .halo { position: relative; width: 150px; height: 150px; flex: none; }
  .halo svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .halo .arc { fill: none; stroke: url(#haloGrad); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .9s cubic-bezier(.3,.7,.3,1); }
  .halo .arcGlow { fill: none; stroke: url(#haloGrad); stroke-width: 10; stroke-linecap: round; filter: blur(7px); opacity: .55; transition: stroke-dashoffset .9s cubic-bezier(.3,.7,.3,1); }
  .halo .trk { fill: none; stroke: var(--track); stroke-width: 10; }
  .halo .ct { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .halo .pct {
    font-size: 30px; font-weight: 700; letter-spacing: -.8px;
    font-family: -apple-system, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(135deg, #14b8a6, #0a84ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .halo .pl { font-size: 10.5px; color: var(--tm); margin-top: 2px; }
  .cmetrics { display: flex; gap: 30px; flex-wrap: wrap; flex: 1; min-width: 260px; }
  .cm { min-width: 130px; }
  .cm .cl { font-size: 11px; color: var(--tm); margin-bottom: 6px; }
  .cm .cv { font-size: 19px; font-weight: 650; letter-spacing: -.3px; }
  .cm .bar { margin-top: 8px; height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; max-width: 150px; }
  .cm .bar div { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #14b8a6, #0a84ff); transition: width .9s cubic-bezier(.3,.7,.3,1); }
  .cm .cs { font-size: 10.5px; color: var(--ts); margin-top: 5px; }

  .fun { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .funit { background: var(--chip); border: 1px solid var(--card-border); border-radius: 14px; padding: 10px 12px;
    transition: transform .25s ease, box-shadow .25s ease; will-change: transform; }
  .funit:hover { box-shadow: 0 8px 22px rgba(10,20,50,.14); }
  .funit .fl { font-size: 11px; color: var(--tm); }
  .funit .fv { font-size: 16px; font-weight: 650; letter-spacing: -.3px; margin-top: 4px; }
  .funit .fs { font-size: 10.5px; color: var(--ts); margin-top: 3px; }

  table.sess { width: 100%; border-collapse: collapse; font-size: 12px; }
  .sess th { text-align: left; color: var(--tm); font-weight: 500; font-size: 11px; padding: 5px 7px; border-bottom: 1px solid var(--baseline); white-space: nowrap; }
  .sess td { padding: 8px 7px; border-bottom: 1px solid var(--row-border); vertical-align: middle; }
  .sess td.num, .sess th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .sess tbody tr { cursor: pointer; transition: background .12s; }
  .sess tbody tr:hover { background: var(--row-hover); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--baseline); }
  .dot.live { background: var(--good); animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(48,209,88,.55); } 100% { box-shadow: 0 0 0 7px rgba(48,209,88,0); } }
  .app-tag { font-size: 10px; padding: 2px 7px; border-radius: 9px; border: 1px solid var(--card-border); color: var(--ts); white-space: nowrap; }
  .app-tag.claude { border-color: rgba(57,135,229,.45); color: #7db2ef; }
  .app-tag.agent  { border-color: rgba(144,133,233,.45); color: #aaa2ee; }
  .app-tag.codex  { border-color: rgba(25,158,112,.45); color: #4dc397; }
  .app-tag.gemini { border-color: rgba(201,133,0,.5);  color: #e0b25c; }
  .app-tag.opencode { border-color: rgba(213,81,129,.5); color: #e58bad; }
  .app-tag.continue { border-color: rgba(230,103,103,.5); color: #ee9c9c; }
  html[data-theme="light"] .app-tag.claude { color: #2f6bd8; }
  html[data-theme="light"] .app-tag.agent  { color: #6f5fd8; }
  html[data-theme="light"] .app-tag.codex  { color: #14855d; }
  html[data-theme="light"] .app-tag.gemini { color: #b07508; }
  html[data-theme="light"] .app-tag.opencode { color: #c2447c; }
  html[data-theme="light"] .app-tag.continue { color: #cc5252; }
  .ellip { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .muted { color: var(--tm); }

  #tip {
    position: fixed; pointer-events: none; display: none; z-index: 50;
    background: var(--tip-bg); border: 1px solid var(--card-border); border-radius: 14px;
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    padding: 9px 11px; font-size: 11px; max-width: 270px;
    box-shadow: 0 8px 22px rgba(10,20,50,.3);
  }
  #tip .t { color: var(--tp); font-weight: 600; margin-bottom: 4px; }
  #tip .r { display: flex; justify-content: space-between; gap: 14px; color: var(--ts); padding: 1.5px 0; }
  #tip .r i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 5px; }

  #drawer {
    position: fixed; top: 0; right: -540px; width: 520px; max-width: 92vw; height: 100vh; z-index: 40;
    background: var(--panel); border-left: 1px solid var(--card-border); border-radius: 22px 0 0 22px;
    backdrop-filter: blur(40px) saturate(160%); -webkit-backdrop-filter: blur(40px) saturate(160%);
    transition: right .2s ease; padding: 18px; overflow-y: auto;
    box-shadow: -12px 0 40px rgba(10,20,50,.3);
  }
  #drawer.open { right: 0; }
  #drawer .close { float: right; background: none; border: none; color: var(--tm); font-size: 18px; cursor: pointer; }
  #drawer h3 { font-size: 15px; font-weight: 650; letter-spacing: -.2px; margin-bottom: 6px; }
  #drawer .meta { color: var(--tm); font-size: 11px; margin-bottom: 12px; word-break: break-all; line-height: 1.5; }
  .tokbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 8px 0 12px; background: var(--track); }
  .tokbar div { height: 100%; }
  .ev { border-left: 2px solid var(--baseline); padding: 4px 0 4px 10px; margin-bottom: 7px; }
  .ev.command { border-left-color: var(--series-4); }
  .ev .ts { color: var(--tm); font-size: 10px; }
  .ev .tx { color: var(--ts); font-size: 12px; white-space: pre-wrap; word-break: break-word; line-height: 1.45; }
  .ev.command .tx { color: var(--series-4); font-family: Consolas, monospace; }
  .fade { animation: fadein .3s ease; }
  @keyframes fadein { from { opacity: .4; } to { opacity: 1; } }

  /* 定价编辑器 */
  #modal {
    position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center;
    background: rgba(10,16,32,.45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #modal.open { display: flex; }
  .mbox {
    width: 660px; max-width: 94vw; max-height: 86vh; overflow-y: auto;
    background: var(--mbox); border: 1px solid var(--card-border); border-radius: 22px; padding: 20px;
    backdrop-filter: blur(40px) saturate(160%); -webkit-backdrop-filter: blur(40px) saturate(160%);
    box-shadow: 0 24px 60px rgba(10,20,50,.4);
  }
  .mbox h3 { font-size: 15px; font-weight: 650; letter-spacing: -.2px; margin-bottom: 5px; }
  .mbox .mnote { color: var(--tm); font-size: 11px; margin-bottom: 12px; line-height: 1.55; }
  table.ptab { width: 100%; border-collapse: collapse; font-size: 12px; }
  .ptab th { text-align: left; color: var(--tm); font-weight: 500; font-size: 10.5px; padding: 4px 6px 6px 2px; border-bottom: 1px solid var(--baseline); }
  .ptab td { padding: 4px 6px 4px 0; }
  .ptab input {
    width: 100%; background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 8px;
    color: var(--tp); padding: 6px 8px; font-size: 12px; font-family: Consolas, monospace; outline: none;
  }
  .ptab input:focus { border-color: var(--accent); }
  .ptab input:disabled { opacity: .55; }
  .ptab .del { background: none; border: none; color: var(--tm); cursor: pointer; font-size: 13px; }
  .ptab .del:hover { color: #ff6b6b; }
  .mbtns { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
  .btn {
    border-radius: 999px; padding: 7px 16px; font-size: 12px; cursor: pointer; font-family: inherit;
    border: 1px solid var(--card-border); background: var(--chip); color: var(--tp);
    transition: background .18s;
  }
  .btn:hover { background: var(--chip-hover); }
  .btn.primary { background: var(--accent); border-color: transparent; font-weight: 600; color: #fff; box-shadow: 0 2px 8px rgba(10,132,255,.4); }
  #pmsg { font-size: 11px; margin-left: auto; }

  @media (prefers-reduced-motion: reduce) {
    .aurora i, .dot.live, .clouds i { animation: none; }
    .rv { opacity: 1; transform: none; transition: none; }
    .fc { transform: none !important; }
    html { scroll-behavior: auto; }
  }
</style>
</head>

<script>
const SLOTS = ['--series-1','--series-2','--series-3','--series-4','--series-5','--series-6','--series-7','--series-8'];
const OTHER_COLOR = '#8a8f98';
const REFRESH_S = 30;
let DATA = null, appFilter = 'all', days = 7, colorMap = new Map(), countdown = REFRESH_S;
const $ = id => document.getElementById(id);
const tip = $('tip'), drawer = $('drawer'), hero = $('hero');
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

function fmtCost(c) { return '$' + (c >= 1000 ? (c/1000).toFixed(2)+'k' : c >= 100 ? c.toFixed(0) : c >= 10 ? c.toFixed(1) : c.toFixed(2)); }
function fmtTok(t) {
  if (t >= 1e9) return (t/1e9).toFixed(2) + 'B';
  if (t >= 1e6) return (t/1e6).toFixed(1) + 'M';
  if (t >= 1e3) return (t/1e3).toFixed(1) + 'k';
  return String(t);
}
function fmtTime(ts) {
  const d = new Date(ts), now = Date.now(), diff = now - ts;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
  const hm = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  if (d.toDateString() === new Date().toDateString()) return hm;
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' + hm;
}
function tokSum(u) { return u.in + u.cw + u.cr + u.out; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function coffee(c) { const n = c / 2.5; return n < 1 ? '' : '≈ ' + (n >= 100 ? Math.round(n) : n.toFixed(1)) + ' 杯咖啡'; }

function greeting() {
  const h = new Date().getHours();
  if (h < 6) return ['🌙 夜深了', '还在肝吗？注意休息'];
  if (h < 12) return ['☀️ 早上好', '新的一天，从看看昨天烧了多少钱开始'];
  if (h < 18) return ['📟 下午好', '监控运转中'];
  return ['🌆 晚上好', '今天的战况如下'];
}

/* ---------- 主题:auto 按时间,可手动循环,URL ?theme= 强制 ---------- */
const urlTheme = new URLSearchParams(location.search).get('theme');
let themePref = urlTheme || localStorage.getItem('theme') || 'auto';
function dayPhase() {
  const h = new Date().getHours() + new Date().getMinutes() / 60;
  if (h >= 5 && h < 8) return 'dawn';
  if (h >= 8 && h < 17) return 'day';
  if (h >= 17 && h < 20) return 'dusk';
  return 'night';
}
function applyTheme() {
  const isDay = (() => { const h = new Date().getHours() + new Date().getMinutes() / 60; return h >= 7 && h < 18.5; })();
  const t = themePref === 'auto' ? (isDay ? 'light' : 'dark') : themePref;
  document.documentElement.dataset.theme = t;
  hero.dataset.phase = urlTheme === 'light' ? 'day' : urlTheme === 'dark' ? 'night' : dayPhase();
  $('themeBtn').textContent = themePref === 'auto' ? '🌗' : themePref === 'light' ? '☀️' : '🌙';
}
applyTheme();
setInterval(() => { if (themePref === 'auto') { applyTheme(); } }, 5 * 60 * 1000);
$('themeBtn').addEventListener('click', () => {
  themePref = themePref === 'auto' ? 'light' : themePref === 'light' ? 'dark' : 'auto';
  localStorage.setItem('theme', themePref);
  applyTheme();
  if (DATA) render(); // 图表颜色取自 CSS 变量,需重画
});

/* ---------- 数字 count-up ---------- */
const prevNums = new Map();
function countTo(el, val, fmt) {
  const key = el.id || el.dataset.k || Math.random();
  const from = prevNums.get(key);
  prevNums.set(key, val);
  if (REDUCED || from === undefined || from === val) { el.textContent = fmt(val); return; }
  const t0 = performance.now();
  (function step(t) {
    const p = Math.min(1, (t - t0) / 650);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(from + (val - from) * e);
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}

function colorOf(model) { return colorMap.get(model) || OTHER_COLOR; }
function appOK(app) { return appFilter === 'all' || app === appFilter; }
function appName(id) { const a = (DATA.apps || []).find(a => a.id === id); return a ? a.name : id; }

function assignColors(models) {
  colorMap = new Map();
  models.slice(0, 8).forEach((m, i) => colorMap.set(m.model, css(SLOTS[i])));
}

// 数据源筛选按钮根据实际有数据的工具动态生成
function buildAppSeg() {
  const seg = $('appSeg');
  const want = ['all', ...(DATA.apps || []).map(a => a.id)];
  const have = [...seg.children].map(b => b.dataset.v);
  if (want.join() !== have.join()) {
    seg.innerHTML = '<button data-v="all">全部</button>' +
      (DATA.apps || []).map(a => `<button data-v="${esc(a.id)}">${esc(a.name)}</button>`).join('');
  }
  if (!want.includes(appFilter)) appFilter = 'all';
  [...seg.children].forEach(b => b.classList.toggle('on', b.dataset.v === appFilter));
}

function filteredDaily() {
  return DATA.daily.map(d => {
    const byModel = {};
    for (const [app, models] of Object.entries(d.byApp)) {
      if (!appOK(app)) continue;
      for (const [m, u] of Object.entries(models)) {
        if (!byModel[m]) byModel[m] = { cost: 0, tok: 0 };
        byModel[m].cost += u.cost; byModel[m].tok += tokSum(u);
      }
    }
    return { date: d.date, byModel };
  });
}

function showTip(ev, html) {
  tip.innerHTML = html;
  tip.style.display = 'block';
  tip.style.left = Math.min(ev.clientX + 12, innerWidth - 290) + 'px';
  tip.style.top = Math.min(ev.clientY + 12, innerHeight - 120) + 'px';
}
function hideTip() { tip.style.display = 'none'; }

function render() {
  if (!DATA) return;
  buildAppSeg();
  assignColors(DATA.models);
  const daily = filteredDaily();
  const sessions = DATA.sessions.filter(s => appOK(s.app));
  const models = DATA.models
    .map(m => {
      if (appFilter === 'all') return { model: m.model, cost: m.cost, tokens: m.tokens };
      const u = m.byApp[appFilter];
      return { model: m.model, cost: u ? u.cost : 0, tokens: u ? tokSum(u) : 0 };
    })
    .filter(m => m.cost > 0.0001 || m.tokens > 0)
    .sort((a, b) => b.cost - a.cost);

  let rangeCost = 0, todayCost = 0, todayTok = 0, rangeTok = 0;
  for (const d of daily) for (const u of Object.values(d.byModel)) { rangeCost += u.cost; rangeTok += u.tok; }
  const today = daily.find(d => d.date === DATA.todayStr);
  if (today) for (const u of Object.values(today.byModel)) { todayCost += u.cost; todayTok += u.tok; }
  const activeN = sessions.filter(s => s.active).length;
  const avgDaily = rangeCost / Math.max(1, daily.length);

  document.title = `AI 用量 · 今日 ${fmtCost(todayCost)}`;
  renderHero({ todayCost, todayTok, rangeCost, avgDaily, activeN, models, daily });
  renderChart(daily);
  renderHeat();
  renderBars('modelList', models.map(m => ({
    name: m.model, color: colorOf(m.model), v: m.cost, right1: fmtTok(m.tokens), right2: fmtCost(m.cost),
  })));
  $('modelCount').textContent = '共 ' + models.length + ' 个模型';
  renderBars('projList', DATA.projects.map(p => ({
    name: p.name, color: css('--series-7'), v: p.cost, right1: p.sessions + ' 会话', right2: fmtCost(p.cost),
  })));
  renderBars('cmdList', DATA.commands.map(c => ({
    name: c.name, color: css('--series-4'), v: c.count, right1: '', right2: c.count + ' 次', mono: true,
  })));
  renderCache();
  renderFun();
  renderSessions(sessions);
  $('status').textContent = '更新于 ' + fmtTime(DATA.generatedAt);
}

function sparkPath(daily, w, h) {
  const vals = daily.map(d => Object.values(d.byModel).reduce((a, u) => a + u.cost, 0));
  if (vals.length < 2) return '';
  const max = Math.max(0.01, ...vals);
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * w).toFixed(1)},${(h - 3 - v / max * (h - 6)).toFixed(1)}`);
  return pts.join(' ');
}

/* hero 鼠标视差(rAF + lerp 缓动,触屏/reduced-motion 不启用) */
if (!REDUCED && matchMedia('(pointer:fine)').matches) {
  let tx = 0, ty = 0, cx = 0, cy = 0, running = false;
  hero.addEventListener('mousemove', e => {
    const r = hero.getBoundingClientRect();
    tx = (e.clientX - r.left) / r.width - 0.5;
    ty = (e.clientY - r.top) / r.height - 0.5;
    if (!running) { running = true; requestAnimationFrame(loop); }
  });
  hero.addEventListener('mouseleave', () => { tx = 0; ty = 0; });
  function loop() {
    cx += (tx - cx) * 0.07; cy += (ty - cy) * 0.07;
    hero.style.setProperty('--mx', cx.toFixed(4));
    hero.style.setProperty('--my', cy.toFixed(4));
    if (Math.abs(cx - tx) < 0.001 && Math.abs(cy - ty) < 0.001 && tx === 0 && ty === 0) { running = false; return; }
    requestAnimationFrame(loop);
  }
}

/* 小卡片 3D tilt(事件委托) */
if (!REDUCED && matchMedia('(pointer:fine)').matches) {
  document.addEventListener('pointermove', e => {
    const el = e.target.closest && e.target.closest('.funit');
    document.querySelectorAll('.funit').forEach(f => { if (f !== el) f.style.transform = ''; });
    if (!el) return;
    const r = el.getBoundingClientRect();
    const rx = ((e.clientY - r.top) / r.height - 0.5) * -7;
    const ry = ((e.clientX - r.left) / r.width - 0.5) * 7;
    el.style.transform = `perspective(500px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) translateY(-1px)`;
  });
}

function renderChart(daily) {
  const svg = $('chart');
  const W = svg.clientWidth || 700, H = 200, padL = 46, padB = 20, padT = 8;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = '';
  const maxCost = Math.max(0.01, ...daily.map(d => Object.values(d.byModel).reduce((a, u) => a + u.cost, 0)));
  const plotW = W - padL - 8, plotH = H - padT - padB;
  const bw = Math.min(46, plotW / Math.max(1, daily.length) * 0.62);
  const step = plotW / Math.max(1, daily.length);
  const ns = 'http://www.w3.org/2000/svg';
  const el = (t, attrs) => { const e = document.createElementNS(ns, t); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

  for (let i = 0; i <= 3; i++) {
    const v = maxCost / 3 * i, y = padT + plotH - plotH * i / 3;
    svg.appendChild(el('line', { x1: padL, x2: W - 8, y1: y, y2: y, stroke: css('--grid'), 'stroke-width': 1 }));
    const t = el('text', { x: padL - 6, y: y + 3, 'text-anchor': 'end', fill: css('--tm'), 'font-size': 10 });
    t.textContent = '$' + (v >= 100 ? v.toFixed(0) : v.toFixed(v >= 10 ? 0 : 1));
    svg.appendChild(t);
  }
  svg.appendChild(el('line', { x1: padL, x2: W - 8, y1: padT + plotH, y2: padT + plotH, stroke: css('--baseline'), 'stroke-width': 1 }));

  const modelOrder = [...colorMap.keys()];
  daily.forEach((d, i) => {
    const x = padL + step * i + (step - bw) / 2;
    let y = padT + plotH;
    const ordered = Object.entries(d.byModel).sort((a, b) => {
      const ia = modelOrder.indexOf(a[0]), ib = modelOrder.indexOf(b[0]);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
    const segs = ordered.map(([m, u]) => ({ m, u, h: u.cost / maxCost * plotH })).filter(s => s.h >= 0.5);
    segs.forEach((s, j) => {
      const gap = j < segs.length - 1 ? 2 : 0;
      const h = Math.max(1, s.h - gap);
      y -= s.h;
      svg.appendChild(el('rect', { x, y, width: bw, height: h, fill: colorOf(s.m), rx: j === segs.length - 1 ? 3 : 0 }));
    });
    if (daily.length <= 10 || i % Math.ceil(daily.length / 8) === 0) {
      const t = el('text', { x: x + bw / 2, y: H - 5, 'text-anchor': 'middle', fill: css('--tm'), 'font-size': 10 });
      t.textContent = d.date.slice(5).replace('-', '/');
      svg.appendChild(t);
    }
    const hit = el('rect', { x: padL + step * i, y: padT, width: step, height: plotH, fill: 'transparent' });
    hit.addEventListener('mousemove', ev => {
      const rows = ordered.filter(([, u]) => u.cost > 0.0001).reverse()
        .map(([m, u]) => `<div class="r"><span><i style="background:${colorOf(m)}"></i>${esc(m)}</span><b>${fmtCost(u.cost)}</b></div>`).join('');
      const total = ordered.reduce((a, [, u]) => a + u.cost, 0);
      showTip(ev, `<div class="t">${d.date} · ${fmtCost(total)}</div>${rows || '<div class="r muted">无用量</div>'}`);
    });
    hit.addEventListener('mouseleave', hideTip);
    svg.appendChild(hit);
  });

  $('legend').innerHTML = [...colorMap.entries()]
    .map(([m, c]) => `<span><i style="background:${c}"></i>${esc(m)}</span>`).join('') +
    (DATA.models.length > 8 ? `<span><i style="background:${OTHER_COLOR}"></i>其他 ${DATA.models.length - 8} 个</span>` : '');
}

// 热力图单色渐变:深色冰蓝,浅色深蓝
function heatColor(v, max) {
  const light = document.documentElement.dataset.theme === 'light';
  if (v <= 0) return light ? 'rgba(23,35,59,.05)' : 'rgba(255,255,255,.06)';
  const t = Math.sqrt(v / max);
  const lo = light ? [219, 231, 245] : [42, 62, 96];
  const hi = light ? [47, 107, 255] : [125, 211, 252];
  const c = lo.map((l, i) => Math.round(l + (hi[i] - l) * t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function renderHeat() {
  const dates = Object.keys(DATA.hourly).sort().slice(-14);
  if (!dates.length) { $('heat').innerHTML = '<tr><td class="muted">无数据</td></tr>'; return; }
  let max = 0.001;
  for (const d of dates) for (const v of DATA.hourly[d]) if (v > max) max = v;
  let html = '<tr><td class="rl"></td>' + [...Array(24)].map((_, h) => `<td class="cl">${h % 3 === 0 ? h : ''}</td>`).join('') + '</tr>';
  for (const d of dates) {
    html += `<tr><td class="rl">${d.slice(5).replace('-', '/')}</td>` + DATA.hourly[d].map((v, h) =>
      `<td style="background:${heatColor(v, max)}" data-d="${d}" data-h="${h}" data-v="${v}"></td>`).join('') + '</tr>';
  }
  $('heat').innerHTML = html;
  $('heat').addEventListener('mousemove', ev => {
    const td = ev.target.closest('td[data-v]');
    if (!td) return hideTip();
    showTip(ev, `<div class="t">${td.dataset.d} ${td.dataset.h}:00</div><div class="r"><span>成本</span><b>${fmtCost(+td.dataset.v)}</b></div>`);
  });
  $('heat').addEventListener('mouseleave', hideTip);
}

const HALO_C = 2 * Math.PI * 64;
function cacheAgg(appIds) {
  let inn = 0, cw = 0, cr = 0;
  for (const m of DATA.models) for (const app of appIds) {
    const u = m.byApp[app];
    if (!u) continue;
    inn += u.in; cw += u.cw; cr += u.cr;
  }
  const denom = inn + cw + cr;
  return { in: inn, cw, cr, rate: denom > 0 ? cr / denom : 0 };
}
function renderCache() {
  const allIds = (DATA.apps || []).map(a => a.id);
  const main = cacheAgg(appFilter === 'all' ? allIds : [appFilter]);
  const off = HALO_C * (1 - main.rate);
  for (const id of ['haloArc', 'haloGlow']) {
    const el = $(id);
    el.setAttribute('stroke-dasharray', HALO_C);
    el.setAttribute('stroke-dashoffset', off);
  }
  $('haloP').textContent = (main.rate * 100).toFixed(1) + '%';
  const perApp = (DATA.apps || [])
    .map(a => ({ name: a.name, ...cacheAgg([a.id]) }))
    .filter(r => r.in + r.cw + r.cr > 0).slice(0, 4);
  $('cacheMetrics').innerHTML = [
    ...perApp.map(r => ({ cl: r.name + ' 命中率', cv: (r.rate * 100).toFixed(1) + '%', w: r.rate, cs: '读取 ' + fmtTok(r.cr) })),
    { cl: '累计缓存读取', cv: fmtTok(main.cr), w: null, cs: '省下约 ' + fmtCost(DATA.stats.savedByCache) },
  ].map(m => `<div class="cm">
      <div class="cl">${m.cl}</div><div class="cv">${m.cv}</div>
      ${m.w !== null ? `<div class="bar"><div style="width:${(m.w * 100).toFixed(1)}%"></div></div>` : ''}
      <div class="cs">${m.cs}</div>
    </div>`).join('');
}

const ringFg = document.querySelector('#ring .fg');

ringFg.style.strokeDasharray = RING_C;
function tickRing() {
  countdown--;
  if (countdown <= 0) { load(); return; }
  ringFg.style.strokeDashoffset = RING_C * (1 - countdown / REFRESH_S);
  $('ringT').textContent = countdown;
}

async function load() {
  countdown = REFRESH_S;

    $('pmsg').textContent = '';
    modal.classList.add('open');
  } catch (e) { alert('读取定价失败: ' + e.message); }
}
$('gearBtn').addEventListener('click', openPricing);
$('pAdd').addEventListener('click', () => {
  $('pBody').insertAdjacentHTML('afterbegin', pRowHtml('', { input: 0, output: 0, cacheWrite: 0, cacheRead: 0 }, false));
  $('pBody').querySelector('.pk').focus();
});
$('pBody').addEventListener('click', e => {
  const b = e.target.closest('.del');
  if (b) b.closest('tr').remove();
});
$('pSave').addEventListener('click', async () => {
  const obj = {};
  if (pComment) obj._comment = pComment;
  for (const tr of $('pBody').querySelectorAll('tr')) {
    const k = tr.querySelector('.pk').value.trim();
    if (!k) continue;
    const v = {};
    for (const inp of tr.querySelectorAll('.pv')) v[inp.dataset.f] = parseFloat(inp.value) || 0;
    obj[k] = v;
  }
  try {
    const res = await fetch('/api/pricing', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj) });
    const j = await res.json();
    if (j.ok) {
      $('pmsg').textContent = '✓ 已保存，成本重算中…'; $('pmsg').style.color = 'var(--good)';
      setTimeout(() => { modal.classList.remove('open'); load(); }, 700);
    } else { $('pmsg').textContent = j.error || '保存失败'; $('pmsg').style.color = '#ff6b6b'; }
  } catch (e) { $('pmsg').textContent = '保存失败: ' + e.message; $('pmsg').style.color = '#ff6b6b'; }
});
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });

// 滚动浮现(仅首次进入视口)
if (!REDUCED) {
  const io = new IntersectionObserver(es => es.forEach(x => {
    if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); }
  }), { threshold: 0.06 });
  document.querySelectorAll('.card').forEach(c => { c.classList.add('rv'); io.observe(c); });
}

window.addEventListener('resize', () => DATA && render());
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { drawer.classList.remove('open'); modal.classList.remove('open'); }
});
load();
</script>
</body>
</html>
